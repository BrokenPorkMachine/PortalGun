# dnsmasq — DHCP + DNS sinkhole for the portal box.
# Every DNS answer points at the portal server so the OS probes
# (captive.apple.com/hotspot-detect.html, connectivitycheck.gstatic.com/
# generate_204, msftconnecttest.com/...) land on the portal and the captive
# network assistant opens our page automatically.

interface=wlan0
bind-interfaces

dhcp-range=10.20.0.50,10.20.0.150,255.255.255.0,12h
dhcp-option=option:router,10.20.0.1
dhcp-option=option:dns-server,10.20.0.1

# Wildcard: any name -> portal box. (Hashed entries are covered by the
# catch-all `address=/#/...` on recent dnsmasq.)
address=/#/10.20.0.1

# Only serve DHCP to test clients, never forward real DNS
no-resolv
no-hosts
log-queries
log-facility=/var/log/dnsmasq-portal.log
