# hostapd — lab access point for the captive-portal test network.
# Run this on a dedicated box (e.g. Raspberry Pi). Use a closed SSID or WPA2
# with a passphrase you know; the captive portal still triggers because the
# OS detectability probes (captive.apple.com / connectivitycheck.gstatic.com)
# are answered by our server instead of the expected content.

interface=wlan0
driver=nl80211
ssid=LAN-CHECK-LAB
hw_mode=g
channel=6
# Closed lab network — change for your lab. WPA2 keeps the RF closed while the
# portal is still reachable for every device you test.
auth_algs=1
wpa=2
wpa_passphrase=CHANGE-ME-LAB-KEY
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
country_code=US
ieee80211d=1
