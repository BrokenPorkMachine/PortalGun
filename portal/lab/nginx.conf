# nginx — serve the portal page for ANY host on plain HTTP.
# The captive-network assistant fetches http(s)://captive.apple.com/... and
# friends; we answer 200 for every one of them so the sheet appears.

server {
    listen 10.20.0.1:80 default_server;
    listen 10.20.0.1:80;
    server_name _;

    root /opt/lan-check/portal/site;
    index index.html;

    # OS probe endpoints: any non-standard answer triggers the portal sheet
    location = /hotspot-detect.html   { return 200 '<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>'; default_type text/html; }
    location = /generate_204          { return 200 "portal"; default_type text/plain; }
    location = /connecttest.txt       { return 200 "portal"; default_type text/plain; }
    location = /ncsi.txt              { return 200 "portal"; default_type text/plain; }

    # API for the page's result reporting
    location /report    { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location /dashboard { proxy_pass http://127.0.0.1:8080; }
    location /api       { proxy_pass http://127.0.0.1:8080; }

    location / { try_files $uri /index.html; }
}
