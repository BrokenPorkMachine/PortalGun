# hostapd — lab access point for the captive-portal test network.
# Run this on a dedicated box (e.g. Raspberry Pi). Use a closed SSID or WPA2
# with a passphrase you know; the captive portal still triggers because the
# OS detectability probes (captive.apple.com / connectivitycheck.gstatic.com)
# are answered by our server instead of the expected content.

interface=wlan0
driver=nl80211
ssid=PortalGun-LAB
hw_mode=g
channel=6
# Closed lab network — change for your lab. WPA2 keeps the RF closed while the
# portal is still reachable for every device you test.
auth_algs=1
wpa=2
wpa_passphrase=CHANGE-ME-LAB-KEY
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
country_code=US
ieee80211d=1

# The captive enforcement in ../setup-enforcement.sh is IPv4-only.
# setup-enforcement.sh now DISABLES IPv6 on this interface itself
# (disable_ipv6 + accept_ra + accept_ra_defrtr + autoconf, persisted in
# /etc/sysctl.d/99-captive-portal.conf), so clients cannot pick up an IPv6
# default route and bypass the portal. This comment documents the reason; the
# actual settings are applied by the script. Pass --no-ipv6 to opt out, and then
# add matching ip6 nft rules yourself.
ieee80211n=1
# hostapd itself does not send RAs; the risk is the host kernel doing so, or a
# stray radvd/dnsmasq DHCPv6 on wlan0. Keep those off this interface.
