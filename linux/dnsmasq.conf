# dnsmasq — DHCP + real DNS for the captive-portal gateway.
#
# IMPORTANT: this file deliberately does NOT wildcard DNS. An earlier revision
# used `address=/#/10.20.0.1`, which breaks authenticated clients: every name
# would still resolve to the portal box, so a client that has signed in could
# never actually reach the internet.
#
# Captive detection does not need a DNS sinkhole here. It works from the
# nftables HTTP redirect in ../setup-enforcement.sh: probes go to the real
# addresses (captive.apple.com, connectivitycheck.gstatic.com, ...) over plain
# HTTP, get intercepted on port 80 and 302'd to the portal. Real DNS is
# required for that to work, and it is what makes post-login browsing work.

interface=wlan0
bind-interfaces

dhcp-range=10.20.0.50,10.20.0.150,255.255.255.0,12h
dhcp-option=option:router,10.20.0.1
dhcp-option=option:dns-server,10.20.0.1

# Resolve through real upstream resolvers. Do NOT leave this pointing at a
# local stub: on Arch/CachyOS /etc/resolv.conf is often 127.0.0.53
# (systemd-resolved), which hotspot clients cannot reach. Name real servers
# explicitly whenever that is the case — setup-gateway.sh warns when it detects
# a 127.x stub in resolv.conf. Uncomment and set yours:
#   server=1.1.1.1
#   server=9.9.9.9
# Leaving these unset makes dnsmasq follow /etc/resolv.conf, which is fine only
# when that file lists real upstream IPs.

# Never hand out the portal box as a resolver for a name we cannot answer, and
# don't serve stale wildcard entries from an old config.
no-hosts

# The portal hostname, if you want clients to reach it by name. The portal is
# otherwise reached by its literal gateway IP (10.20.0.1) or via the probe
# redirect, so this is optional.
# address=/portal.lan/10.20.0.1

log-queries
log-facility=/var/log/dnsmasq-portal.log
