# dnsmasq — DHCP + DNS for the captive-portal gateway.
#
# IMPORTANT: this file deliberately does NOT wildcard DNS. An earlier revision
# used `address=/#/10.20.0.1`, which breaks authenticated clients: every name
# would still resolve to the portal box, so a client that has signed in could
# never actually reach the internet.
#
# Captive detection does not need a DNS sinkhole here. It works from the
# nftables HTTP redirect in ../setup-enforcement.sh: probes go to the real
# addresses (captive.apple.com, connectivitycheck.gstatic.com, ...) over plain
# HTTP, get intercepted on port 80 and 302'd to the portal. Real DNS is
# required for that to work, and it is what makes post-login browsing work.
#
# ---------------------------------------------------------------------------
# Closed loop
# ---------------------------------------------------------------------------
# The lab network is CLOSED: the gateway, the access point and the devices
# under test are the entire network. There is no internet behind the gateway,
# so there is no upstream resolver to forward to. `no-resolv` keeps dnsmasq
# from sending lookups out of the lab (a query for a real name would otherwise
# leave the network and hang until it timed out).
#
# That makes the probe hostnames below the ONLY names that resolve — and they
# have to resolve. A device checks for a captive portal by issuing a plain
# HTTP request to a hostname it expects to exist. If the name does not
# resolve, no request is made, the network assistant never opens, and the
# portal is never shown. Resolving them to the gateway sends the probe to our
# port 80, where nginx answers with the 302 that opens the sign-in sheet.
#
# setup-gateway.sh rewrites `interface=` and the gateway address below to
# match the -i/-g values it was given.

interface=wlan0
bind-interfaces

dhcp-range=10.20.0.50,10.20.0.150,255.255.255.0,12h
dhcp-option=option:router,10.20.0.1
dhcp-option=option:dns-server,10.20.0.1

# No upstream: this network has no internet. setup-gateway.sh uncomments this
# line when it runs with --closed-loop (there is nothing to forward to, and a
# lookup would otherwise leave the lab and hang until it timed out). Leave it
# commented when the gateway really does have an upstream.
#no-resolv

# The only names that must resolve — the OS captive probes. Every one of them
# points at the gateway so the probe arrives on our port 80.
host-record=captive.apple.com,10.20.0.1
host-record=connectivity.apple.com,10.20.0.1
host-record=gsp1.apple.com,10.20.0.1
host-record=connectivitycheck.gstatic.com,10.20.0.1
host-record=www.msftconnecttest.com,10.20.0.1
host-record=www.msftncsi.com,10.20.0.1
host-record=detectportal.firefox.com,10.20.0.1

# Never hand out the portal box as a resolver for a name we cannot answer, and
# don't serve stale wildcard entries from an old config.
no-hosts

# The portal hostname, if you want clients to reach it by name. The portal is
# otherwise reached by its literal gateway IP (10.20.0.1) or via the probe
# redirect, so this is optional.
# address=/portal.lan/10.20.0.1

log-queries
log-facility=/var/log/dnsmasq-portal.log
