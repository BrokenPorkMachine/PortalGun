    root /opt/lan-check/site;
    index index.html;

    # OS probe endpoints: answer with a redirect to the portal so the captive
    # network assistant opens our page automatically. Do NOT return the OS'
    # expected success content here (e.g. Apple's "Success" page) — that tells
    # the OS the network is open and hides the portal instead.
    location = /hotspot-detect.html   { return 302 http://$host/; }
    location = /generate_204          { return 302 http://$host/; }
    location = /connecttest.txt       { return 302 http://$host/; }
    location = /ncsi.txt              { return 302 http://$host/; }

    # Portal server endpoints (reporting, dashboard, module API, sign-in).
    location /report    { proxy_pass http://127.0.0.1:8080; }
    location /login     { proxy_pass http://127.0.0.1:8080; }
    location /dashboard { proxy_pass http://127.0.0.1:8080; }
    location /api       { proxy_pass http://127.0.0.1:8080; }
    location /modules   { proxy_pass http://127.0.0.1:8080; }
    location = /core.js  { proxy_pass http://127.0.0.1:8080; }
    location = /core.css { proxy_pass http://127.0.0.1:8080; }

    # Anything else falls through to the portal landing page.
    location / { try_files $uri @portal; }
    location @portal { proxy_pass http://127.0.0.1:8080; }
}
