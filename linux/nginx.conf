# nginx — catch-all HTTP front door on the hotspot gateway (port 80).
#
# Why this exists: captive clients have their plain HTTP redirected here by the
# nftables rules in setup-enforcement.sh. nginx terminates port 80, answers the
# OS detectability probes with a redirect to the portal, and proxies everything
# else to the portal server on 127.0.0.1:8080.
#
# HTTPS is intentionally NOT served here. Unauthenticated clients have 443
# dropped by the firewall (you cannot transparently redirect TLS), which is what
# makes the OS fall back to its HTTP probe — see setup-enforcement.sh.
#
# The listen address is rewritten by setup-gateway.sh to the gateway IP given
# with -g (default 10.20.0.1). In the closed-loop topology the probe hostnames
# resolve to exactly this address, so the OS probe lands here.

server {
    # Bind the hotspot gateway address. Change if you use a different subnet
    # (must match the -g/--gateway value given to setup-enforcement.sh).
    listen 10.20.0.1:80 default_server;
    server_name _;

    # Proxy headers live at the server level on purpose. nginx inherits
    # proxy_set_header from the enclosing level ONLY when the current level
    # defines none of its own, so the per-location copies this replaced would
    # have shadowed the whole block (and X-Forwarded-For with it).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The portal server resolves the client IP from this header when the
    # request arrives from loopback. Rightmost entry wins, so a client that
    # sends its own X-Forwarded-For cannot spoof its address.
    proxy_set_header X-Forwarded-For $remote_addr;

    # Static assets served by the portal server; proxied so there is a single
    # source of truth and no need to copy site/ onto this box separately.
