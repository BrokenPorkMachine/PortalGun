# nginx — catch-all HTTP front door on the hotspot gateway (port 80).
#
# Why this exists: captive clients have their plain HTTP redirected here by the
# nftables rules in setup-enforcement.sh. nginx terminates port 80, answers the
# OS detectability probes with a redirect to the portal, and proxies everything
# else to the portal server on 127.0.0.1:8080.
#
# HTTPS is intentionally NOT served here. Unauthenticated clients have 443
# dropped by the firewall (you cannot transparently redirect TLS), which is what
# makes the OS fall back to its HTTP probe — see setup-enforcement.sh.

server {
    # Bind the hotspot gateway address. Change if you use a different subnet
    # (must match the -g/--gateway value given to setup-enforcement.sh).
    listen 10.20.0.1:80 default_server;
    server_name _;

    # Static assets served by the portal server; proxied so there is a single
    # source of truth and no need to copy site/ onto this box separately.
    root /opt/lan-check/portal/site;
    index index.html;

    # OS probe endpoints: answer with a redirect to the portal so the captive
    # network assistant opens our page automatically. Do NOT return the OS'
    # expected success content here (e.g. Apple's "Success" page) — that tells
    # the OS the network is open and hides the portal instead.
    location = /hotspot-detect.html   { return 302 http://$host/; }
    location = /generate_204          { return 302 http://$host/; }
    location = /connecttest.txt       { return 302 http://$host/; }
    location = /ncsi.txt              { return 302 http://$host/; }

    # Portal server endpoints (reporting, dashboard, module API, sign-in).
    location /report    { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location /login     { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location /dashboard { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location /api       { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location /modules   { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location = /core.js  { proxy_pass http://127.0.0.1:8080; }
    location = /core.css { proxy_pass http://127.0.0.1:8080; }

    # Anything else falls through to the portal landing page.
    location / { try_files $uri @portal; }
    location @portal { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
}
